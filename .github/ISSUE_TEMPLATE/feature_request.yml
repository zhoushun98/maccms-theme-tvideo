name: 功能建议
description: 新页面、新功能或改进现有交互
labels: [enhancement]
body:
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 在什么情况下需要它？现在的做法有什么不便？
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望的效果
      description: 可以附上参考截图或其他站点的示例
    validations:
      required: true
