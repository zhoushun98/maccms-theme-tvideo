<form class="tv-form tv-pop-login mac_login_form" action="{:mac_url('user/login')}" method="post" data-tv-ajax-form data-reload>
  <div class="tv-field"><input class="tv-input" type="text" name="user_name" placeholder="用户名" autocomplete="username" maxlength="30" required></div>
  <div class="tv-field"><input class="tv-input" type="password" name="user_pwd" placeholder="密码" autocomplete="current-password" maxlength="32" required></div>
  {if condition="$GLOBALS['config']['user']['login_verify'] eq 1"}
  <div class="tv-field tv-field__row"><input class="tv-input" type="text" name="verify" placeholder="验证码" autocomplete="off" maxlength="6" required><img class="mac_verify_img" src="{:url('verify/index')}" alt="验证码" title="看不清？点击刷新"></div>
  {/if}
  <p class="tv-form__msg" data-tv-form-msg></p>
  <button class="tv-btn tv-btn--primary tv-btn--block" type="submit">登录</button>
  <div class="tv-form__links"><a href="{:mac_url('user/reg')}">注册新账号</a><a href="{:mac_url('user/findpass')}">忘记密码</a></div>
</form>
